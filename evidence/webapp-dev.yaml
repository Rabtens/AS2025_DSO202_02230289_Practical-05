apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: dev
  name: webapp-dev
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>webapp - dev</title></head>
      <body style="background:#e8f5e9">
        <h1>DEV - development environment</h1>
        <p>Namespace: webapp-dev | Replicas: 1</p>
      </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: kustomize-practical
    environment: dev
  name: web-content-fb4bcc97t6
  namespace: webapp-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-practical
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    training.example.com/description: NGINX demo workload for the Kustomize practical
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: webapp
    app.kubernetes.io/part-of: kustomize-practical
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
        environment: dev
    spec:
      containers:
      - image: nginx:1.30-alpine
        name: nginx
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-fb4bcc97t6
        name: web-content
